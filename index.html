<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigasi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #111;
      padding: 40px 20px;
    }

    main { width: 100%; max-width: 360px; }

    h1 {
      font-size: .8rem;
      font-weight: 500;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 24px;
    }

    ul { list-style: none; }

    li + li { border-top: 1px solid #e5e5e5; }

    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      color: inherit;
      text-decoration: none;
      font-size: 1.1rem;
    }

    a::after {
      content: "→";
      color: #bbb;
      transition: transform .2s, color .2s;
    }

    a:hover::after,
    a:focus-visible::after {
      color: #111;
      transform: translateX(4px);
    }

    a:focus-visible { outline: 2px solid #111; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Navigasi</h1>

    <!--
      DAFTAR HALAMAN
      Ubah atau tambah item di sini. Atribut href = nama file HTML tujuan
      (letakkan file tersebut di folder yang sama dengan index.html).
    -->
    <nav>
      <ul>
        <li><a href="test1.html">Test 1 - YT</a></li>
        <li><a href="test2.html">Test 2 - Outlook</a></li>
        <li><a href="test3.html">Test 3 - Claude</a></li>
        <li><a href="test4.html">Test 4 - BPJS</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
