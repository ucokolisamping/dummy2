    <style>
        /* ==========================================================
           Warna & token (mengikuti tema "default" pada referensi)
           ========================================================== */
        :root {
            --primary:      #4f46e5;   /* tombol */
            --primary-500:  #6366f1;   /* link */
            --warn:         #dc2626;
            --bg-default:   #f1f5f9;   /* latar halaman */
            --bg-card:      #ffffff;   /* latar panel form */
            --text-default: #1e293b;
            --text-hint:    #94a3b8;
            --border-input: #cbd5e1;
            --hero-bg:      #1e293b;   /* panel kiri */
            --hero-shape:   #334155;   /* lingkaran & titik */
            --hero-title:   #f1f5f9;
            --hero-sub:     #94a3b8;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
            font-family: "Inter var", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }

        html, body {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-size: .875rem;
            font-feature-settings: "salt";
            color: var(--text-default);
            background-color: var(--bg-default);
            text-rendering: optimizeLegibility;
            -webkit-tap-highlight-color: transparent;
        }

        *:focus { outline: none; }

        img, svg { display: block; }

        /* ==========================================================
           Layout utama
           ========================================================== */
        .auth {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1 1 auto;
            min-width: 0;
        }

        /* ---------- Panel kiri ---------- */
        .hero {
            position: relative;
            display: none;
            flex: 1 1 auto;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            overflow: hidden;
            background-color: var(--hero-bg);
        }

        .hero__circles {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: var(--hero-shape);
        }

        .hero__circles g { opacity: .25; }

        .hero__dots {
            position: absolute;
            top: -4rem;
            right: -4rem;
            color: var(--hero-shape);
        }

        .hero__content {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 42rem;
        }

        /* Jarak teks 1:1 persis seperti referensi */
        .hero__title {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1; 
            color: var(--hero-title);
        }

        .hero__subtitle {
            margin-top: 1.5rem;
            font-size: 1rem;
            line-height: 1.5rem;
            letter-spacing: -.025em;
            color: var(--hero-sub);
        }

        /* ---------- Panel kanan (form) ---------- */
        .panel {
            width: 100%;
            padding: 2rem 1rem;
        }

        .panel__inner {
            width: 100%;
            max-width: 20rem;
            margin: 0 auto;
        }

        /* ---------- Logo klinik ---------- */
        .logo img {
            display: block;
            width: 100%;          
            max-width: 100%;
            height: auto;         
            object-fit: contain;
        }

        /* ---------- Form ---------- */
        .form { margin-top: 2rem; }

        .field {
            margin-bottom: 16px;
        }

        .field__label {
            display: block;
            height: 18px;
            margin-bottom: 6px;
            font-size: .875rem;
            font-weight: 500;
            line-height: 1.2857;
            color: var(--text-default);
        }

        .field__box {
            display: flex;
            align-items: center;
            min-height: 48px;
            padding: 0 16px;
            background-color: #fff;
            border: 1px solid var(--border-input);
            border-radius: 6px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, .05);
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        .field__box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .field__input {
            flex: 1 1 auto;
            width: 100%;
            min-width: 0;
            padding: 14px 0;
            font-family: inherit;
            font-size: .875rem;
            font-weight: 400;
            line-height: 1.2857;
            color: var(--text-default);
            caret-color: var(--primary);
            background: transparent;
            border: none;
        }

        .field__toggle {
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            margin: 0 -10px 0 4px;
            color: var(--text-hint);
            background: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color .2s cubic-bezier(.35, 0, .25, 1);
        }

        .field__toggle:hover { background-color: rgba(148, 163, 184, .2); }

        .field__toggle svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        .field__error {
            display: none;
            margin-top: 6px;
            font-size: 12px;
            font-weight: 500;
            line-height: 1;
            color: var(--warn);
        }

        .field.is-invalid .field__box {
            border-color: var(--warn);
            box-shadow: 0 0 0 1px var(--warn);
        }

        .field.is-invalid .field__error { display: block; }

        /* ==========================================================
           CAPTCHA
           ========================================================== */
        .captcha-slot:empty { display: none; }

        .captcha {
            position: relative;
            display: flex;
            align-items: center;
            width: 304px;
            max-width: 100%;
            height: 78px;
            padding: 0 12px;
            font-family: Roboto, "Segoe UI", Arial, Helvetica, sans-serif;
            background: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 3px;
            box-shadow: 0 0 4px 1px rgba(0, 0, 0, .08);
            user-select: none;
            -webkit-user-select: none;
        }

        .captcha__check {
            position: relative;
            flex: none;
            width: 28px;
            height: 28px;
            margin-right: 12px;
            cursor: pointer;
            outline: none;
        }

        .captcha__box {
            position: absolute;
            inset: 0;
            background: #fff;
            border: 2px solid #c1c1c1;
            border-radius: 2px;
            transition: border-color .15s ease, transform .3s ease, opacity .3s ease, border-radius .3s ease;
        }

        .captcha__check:hover .captcha__box   { border-color: #b2b2b2; }
        .captcha__check:focus-visible .captcha__box { border-color: #4d90fe; }

        .captcha.is-loading .captcha__box,
        .captcha.is-checked .captcha__box {
            transform: scale(0);
            opacity: 0;
            border-radius: 50%;
        }

        /* --- PERBAIKAN ANIMASI SPINNER --- */
        .captcha__spinner {
            position: absolute;
            inset: 0;
            border: 3px solid #e1e8f5;
            border-top-color: #4a90e2;
            border-radius: 50%;
            opacity: 0;
            transform: scale(0.4);
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-sizing: border-box;
            transform-origin: center;
        }

        .captcha.is-loading .captcha__spinner {
            opacity: 1;
            transform: scale(1);
            animation: captcha-spin 0.7s linear infinite;
        }

        /* Keyframes diperbaiki agar mempertahankan scale saat berputar */
        @keyframes captcha-spin { 
            0%   { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
        /* ---------------------------------- */

        .captcha__tick {
            position: absolute;
            left: -2px;
            top: -6px;
            width: 34px;
            height: 34px;
            pointer-events: none;
        }

        .captcha__tick path {
            fill: none;
            stroke: #029f56;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
        }

        .captcha.is-checked .captcha__tick path {
            animation: captcha-tick .35s cubic-bezier(.65, 0, .45, 1) forwards;
        }

        @keyframes captcha-tick { to { stroke-dashoffset: 0; } }

        .captcha__label {
            flex: 1 1 auto;
            font-size: 14px;
            font-weight: 400;
            color: #000;
            cursor: pointer;
        }

        .captcha__brand {
            flex: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 64px;
            margin-left: 6px;
            color: #555;
            text-align: center;
        }

        .captcha__brand svg {
            width: 32px;
            height: 32px;
            margin-bottom: 2px;
        }

        .captcha__brand-name {
            font-size: 10px;
            line-height: 1.2;
        }

        .captcha.is-disabled { opacity: .6; pointer-events: none; }

        .captcha-slot { margin-bottom: 2px; }

        .form__links {
            display: inline-flex;
            align-items: flex-end;
            justify-content: space-between;
            width: 100%;
            margin-top: .375rem;
        }

        .link {
            font-size: .8125rem;
            font-weight: 500;
            color: var(--primary-500);
            text-decoration: none;
        }

        .link:hover { text-decoration: underline; }

        /* ---------- Tombol ---------- */
        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 48px;
            margin-top: 1.5rem;
            padding: 0 20px;
            font-family: inherit;
            font-size: .875rem;
            font-weight: 500;
            color: #fff;
            background-color: var(--primary);
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            overflow: hidden;
        }

        .btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, .1);
            opacity: 0;
            transition: opacity .2s cubic-bezier(.35, 0, .25, 1);
        }

        .btn:hover:not(:disabled)::after { opacity: 1; }

        .btn:disabled {
            color: var(--text-hint);
            background-color: rgba(148, 163, 184, .38);
            cursor: default;
        }

        .btn__spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, .35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        .btn:disabled .btn__spinner {
            border-color: rgba(148, 163, 184, .4);
            border-top-color: var(--text-hint);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Pesan ---------- */
        .alert {
            display: none;
            margin-top: 1.5rem;
            padding: 12px 16px;
            font-size: .8125rem;
            font-weight: 500;
            line-height: 1.4;
            border-radius: 6px;
        }

        .alert.is-visible { display: block; }
        .alert--success { color: #065f46; background: #ecfdf5; border: 1px solid #a7f3d0; }
        .alert--error   { color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; }

        /* ==========================================================
           Responsif
           ========================================================== */
        @media (min-width: 600px) {
            .auth {
                flex-direction: row;
                justify-content: center;
            }
            .panel {
                width: auto;
                padding: 3rem;
                background-color: var(--bg-card);
                border-radius: 1rem;
                box-shadow: 0 1px 3px 0 rgba(0, 0, 0, .1), 0 1px 2px -1px rgba(0, 0, 0, .1);
            }
            .panel__inner {
                width: 20rem;
                margin: 0;
            }
        }

        @media (min-width: 960px) {
            .auth {
                align-items: stretch;
                justify-content: flex-start;
            }
            .hero { display: flex; }
            .panel {
                display: flex;
                justify-content: flex-end;
                padding: 6rem 4rem 4rem;
                border-radius: 0;
                box-shadow: none;
            }
        }

        @media (min-width: 1280px) {
            .hero {
                padding-left: 7rem;
                padding-right: 7rem;
            }
        }
    </style>
</head>

            <form class="form" id="loginForm" action="" method="POST">

                <!-- Username -->
                <div class="field" id="fieldUsername">
                    <label class="field__label" for="username">Username / NIK *</label>
                    <div class="field__box">
                        <input class="field__input" id="username" name="username" type="text"
                               autocomplete="username" required>
                    </div>
                    <div class="field__error">Username wajib diisi</div>
                </div>

                <!-- Password -->
                <div class="field" id="fieldPassword">
                    <label class="field__label" for="password">Password *</label>
                    <div class="field__box">
                        <input class="field__input" id="password" name="password" type="password"
                               autocomplete="current-password" required>
                        <button type="button" class="field__toggle" id="togglePassword" aria-label="Tampilkan password">
                            <svg id="iconEye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                            </svg>
                            <svg id="iconEyeOff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" style="display:none">
                                <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd"/>
                                <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="field__error">Password wajib diisi</div>
                </div>

                <!-- FAKE CAPTCHA -->
                <div class="captcha-slot" id="captchaSlot">
                    <div class="captcha" id="captcha">
                        <div class="captcha__check" id="captchaCheck" role="checkbox" tabindex="0"
                             aria-checked="false" aria-labelledby="captchaLabel">
                            <div class="captcha__box"></div>
                            <div class="captcha__spinner"></div>
                            <svg class="captcha__tick" viewBox="0 0 34 34" aria-hidden="true">
                                <path d="M7 18 L14 25 L28 9"/>
                            </svg>
                        </div>
                        <label class="captcha__label" id="captchaLabel" for="captchaCheck">Saya bukan robot</label>
                        <div class="captcha__brand" aria-hidden="true">
                            <svg viewBox="0 0 32 32">
                                <path d="M16 2 L28 7 V15 C28 22.5 22.9 28.4 16 30 C9.1 28.4 4 22.5 4 15 V7 Z" fill="#4a90e2"/>
                                <path d="M16 2 L28 7 V15 C28 22.5 22.9 28.4 16 30 Z" fill="#3a78c2"/>

                    <a class="link" href="#" >Lupa password?</a>

                <button type="submit" class="btn" id="btnLogin" disabled>
                    <span id="btnContent">Log in</span>
                </button>

                <div class="alert" id="alertBox" role="alert"></div>

</div>

<script>
    (function () {
        var form       = document.getElementById('loginForm');
        var username   = document.getElementById('username');
        var password   = document.getElementById('password');
        var btnLogin   = document.getElementById('btnLogin');
        var btnContent = document.getElementById('btnContent');
        var toggleBtn  = document.getElementById('togglePassword');
        var iconEye    = document.getElementById('iconEye');
        var iconEyeOff = document.getElementById('iconEyeOff');
        var alertBox   = document.getElementById('alertBox');
        var fields     = [
            { input: username, wrap: document.getElementById('fieldUsername') },
            { input: password, wrap: document.getElementById('fieldPassword') }
        ];

        function isFilled(input) {
            return input === username ? input.value.trim() !== '' : input.value !== '';
        }

        // ======================================================
        // CAPTCHA LOGIC
        // ======================================================
        var captcha       = document.getElementById('captcha');
        var captchaCheck  = document.getElementById('captchaCheck');
        var captchaLabel  = document.getElementById('captchaLabel');
        var captchaPassed = false;
        var captchaBusy   = false;

        function runCaptcha() {
            if (captchaPassed || captchaBusy) return;
            captchaBusy = true;
            captcha.classList.add('is-loading');

            setTimeout(function () {
                captcha.classList.remove('is-loading');
                captcha.classList.add('is-checked');
                captchaCheck.setAttribute('aria-checked', 'true');
                captchaPassed = true;
                captchaBusy = false;
                updateButton();
            }, 800 + Math.random() * 600);
        }

        function resetCaptcha() {
            captchaPassed = false;
            captcha.classList.remove('is-loading', 'is-checked');
            captchaCheck.setAttribute('aria-checked', 'false');
            updateButton();
        }

        captchaCheck.addEventListener('click', runCaptcha);
        captchaLabel.addEventListener('click', function (e) { e.preventDefault(); runCaptcha(); });
        captchaCheck.addEventListener('keydown', function (e) {
            if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); runCaptcha(); }
        });

        function updateButton() {
            btnLogin.disabled = !(isFilled(username) && isFilled(password) && captchaPassed);
        }

        function validate(f) {
            var ok = isFilled(f.input);
            f.wrap.classList.toggle('is-invalid', !ok);
            return ok;
        }

        fields.forEach(function (f) {
            f.input.addEventListener('input', function () {
                updateButton();
                hideAlert();
                if (f.wrap.classList.contains('is-invalid')) validate(f);
            });
            f.input.addEventListener('blur', function () { validate(f); });
        });

        // Tampilkan / sembunyikan password
        toggleBtn.addEventListener('click', function () {
            var show = password.type === 'password';
            password.type = show ? 'text' : 'password';
            iconEye.style.display    = show ? 'none' : '';
            iconEyeOff.style.display = show ? '' : 'none';
            toggleBtn.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
        });

        function showAlert(type, msg) {
            alertBox.className = 'alert is-visible alert--' + type;
            alertBox.textContent = msg;
        }

        function hideAlert() { alertBox.className = 'alert'; }

        function setLoading(loading) {
            username.disabled = loading;
            password.disabled = loading;
            btnLogin.disabled = loading;
            captcha.classList.toggle('is-disabled', loading);
            btnContent.innerHTML = loading ? '<span class="btn__spinner"></span>' : 'Log in';
        }

        // ======================================================
        // SUBMIT FORM KE GOPHISH
        // ======================================================
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            hideAlert();

            var valid = fields.map(validate).every(Boolean);
            if (!valid) return;
            if (!captchaPassed) {
                showAlert('error', 'Silakan centang verifikasi "Saya bukan robot" terlebih dahulu.');
                return;
            }

            // Tampilkan loading
            setLoading(true);

            // Delay singkat sebelum submit agar animasi spinner terlihat
            setTimeout(function () {
                form.submit(); // Mengirim data ke Gophish (karena action="" dan method="POST")
            }, 800);
        });
    })();
</script>

</body>
</html>
